<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.8; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { r: 8; opacity: 1; filter: drop-shadow(0 0 12px #818cf8); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }

    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .flow-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8 6; animation: dashMove 12s linear infinite; opacity: 0.6; }
    .flow-line-alt { stroke: #c084fc; stroke-width: 2; stroke-dasharray: 6 6; animation: dashMove 16s linear infinite reverse; opacity: 0.5; }
    .node-p1 { animation: pulseNode 3s ease-in-out infinite; }
    .node-p2 { animation: pulseNode 4s ease-in-out infinite 1s; }
    .node-p3 { animation: pulseNode 3.5s ease-in-out infinite 2s; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    .shimmer-badge { animation: shimmer 4s ease-in-out infinite; }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Tech Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Supply Chain Planning Connected Dynamic Graphs / Network -->
  <g opacity="0.85">
    <!-- Network Flow Paths -->
    <path d="M 80 180 Q 250 80 450 180 T 800 120 T 1120 220" fill="none" class="flow-line"/>
    <path d="M 120 280 Q 350 320 600 240 T 950 280 T 1150 140" fill="none" class="flow-line-alt"/>
    <path d="M 200 90 L 350 180 L 520 100 L 700 220 L 880 140 L 1050 260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Nodes with Dynamic Animations -->
    <circle cx="80" cy="180" r="6" fill="#38bdf8" class="node-p1"/>
    <circle cx="250" cy="120" r="5" fill="#818cf8" class="node-p2"/>
    <circle cx="450" cy="180" r="7" fill="#38bdf8" class="node-p3"/>
    <circle cx="600" cy="240" r="6" fill="#c084fc" class="node-p1"/>
    <circle cx="800" cy="120" r="7" fill="#38bdf8" class="node-p2"/>
    <circle cx="950" cy="280" r="5" fill="#818cf8" class="node-p3"/>
    <circle cx="1120" cy="220" r="6" fill="#c084fc" class="node-p1"/>
  </g>

  <!-- Header Content -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <g class="shimmer-badge" transform="translate(0, -55)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="0" y="5" fill="#38bdf8" font-size="13" class="sub-text" letter-spacing="2">🌐 ENTERPRISE ECOSYSTEM &amp; TOOLKIT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="30" fill="url(#accentGrad)" font-size="44" class="title-text" filter="url(#glowSubtle)">
      Awesome Supply Chain Planning
    </text>

    <!-- Subtitle -->
    <text x="0" y="75" fill="#94a3b8" font-size="18" class="sub-text">
      Curated SaaS Platforms, AI Engines, APS, S&amp;OP/IBP &amp; Open-Source Optimization Repositories
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 125)">
      <g transform="translate(-280, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" class="sub-text">📈 Demand Forecasting</text>
      </g>
      <g transform="translate(-95, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" class="sub-text">📦 Inventory Optimization</text>
      </g>
      <g transform="translate(95, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" class="sub-text">⚙️ APS &amp; Scheduling</text>
      </g>
      <g transform="translate(280, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12" class="sub-text">🔄 S&amp;OP / IBP Scenarios</text>
      </g>
    </g>
  </g>
</svg>
